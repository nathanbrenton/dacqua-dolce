[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "dacqua-dolce-backend"
version = "0.1.0"
description = "D'Acqua Dolce FastAPI backend"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
    "pwdlib[argon2]==0.3.1",
    # Runtime HTTP client used directly by the Postmark adapter.
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    # Starlette TestClient prefers httpx2; keep it alongside runtime httpx.
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "bandit==1.9.1",
    "pip-audit==2.10.1",
]

# Package only application Python modules.
# Alembic migrations and tests remain repository/runtime-support files.
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["alembic", "alembic.*", "tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Unexpected warnings fail tests.
    "error",
    # Temporary upstream Starlette/AnyIO compatibility exception.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead\\.:DeprecationWarning:starlette\\.testclient",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
